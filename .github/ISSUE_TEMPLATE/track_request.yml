name: Track suggestion
description: Suggest a track you'd like to see in Project CARS 2.
labels: ["track request"]
body:
  - type: input
    id: track
    attributes:
      label: Track
      placeholder: Spa-Francorchamps
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Link
      description: Anything that helps, like a track map or a mod you have in mind.
  - type: textarea
    id: why
    attributes:
      label: Anything else?
      description: A layout you care about, or why you'd like it in PC2.
